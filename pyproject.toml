[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "arcclone"
version = "0.4.0"
description = "Navigateur multi-panneaux IA pour macOS (PySide6 + QtWebEngine)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "PySide6>=6.7.0"
]

[project.scripts]
arcclone = "app:main"

[tool.setuptools]
packages = ["app"]
