[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "teamai"
version = "0.5.0"
description = "TeamAI — Navigateur multi-panneaux IA pour macOS"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "PySide6>=6.7.0"
]

[project.scripts]
teamai = "app:main"

[tool.setuptools.packages.find]
include = ["app*"]
