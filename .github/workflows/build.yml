name: Build & Test

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Build
        run: |
          cd ArcClone
          xcodebuild -scheme ArcClone -derivedDataPath Build clean build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO | xcpretty
      - name: Test
        run: |
          cd ArcClone
          xcodebuild -scheme ArcClone -derivedDataPath Build test CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO | xcpretty
