<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamAI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- SIDEBAR -->
    <aside id="sidebar">
      <div id="logo">🧠 TeamAI</div>
      <button id="btn-new-tab" class="action-btn primary">+ Nouvel Onglet IA</button>
      <button id="btn-add-ia" class="action-btn" style="margin-top:1px;font-size:9px">✚ Ajouter IA</button>

      <div id="zoom-controls">
        <button id="zoom-out">−</button>
        <span id="zoom-level">100%</span>
        <button id="zoom-in">+</button>
        <button id="zoom-reset">⊙</button>
        <button id="btn-reset-layout">↺</button>
      </div>

      <div id="stats"></div>
      <div id="window-list"></div>

      <div class="section-title">🔌 MES IA</div>
      <div id="providers-list"></div>

      <div id="sidebar-bottom">
        <button id="btn-login-assistant" class="action-btn">🔑 Assistant Connexion</button>
        <button id="btn-report" class="action-btn">📋 Rapport</button>
        <button id="btn-update" class="sidebar-btn" style="font-size:7px;color:#666" title="Mise à jour depuis GitHub">🔄 Mettre à jour</button>
        <button class="action-btn primary" id="btn-save-session">💾 Sauvegarder la session</button>
        <div id="version-badge">v0.0.0</div>
      </div>
    </aside>

    <!-- MAIN -->
    <div id="main">
      <!-- Prompt bar TOP -->
      <div id="prompt-bar">
        <div id="prompt-wrap">
          <textarea id="prompt-input" rows="4" placeholder="Pose ta question à TOUTES les IA..."></textarea>
          <div id="prompt-actions">
            <button id="btn-attach" title="Joindre un fichier">📎</button>
            <button id="go-btn">SEARCH ALL</button>
          </div>
        </div>
      </div>

      <!-- Viewport with webviews -->
      <div id="viewport">
        <div id="error-bar"></div>
        <div id="grid-container"></div>
      </div>
    </div>
  </div>

  <!-- Login Wizard Modal -->
  <div id="login-modal">
    <div id="login-content">
      <div id="login-header">
        <h2>🔑 Assistant Connexion</h2>
        <p id="login-progress">Étape <span id="login-step-num">0</span>/<span id="login-total">0</span></p>
      </div>
      <div id="login-body">
        <div id="login-provider-card">
          <span id="login-icon">⚡</span>
          <span id="login-label">GPT-5.6 Terra</span>
        </div>
        <p id="login-instruction">Connecte-toi via la fenêtre dédiée, puis clique "Suivant".</p>
        <div id="login-webview-container">
          <div class="login-placeholder">🔑 Fenêtre de connexion ouverte — utilise ton trousseau Apple / Chrome</div>
        </div>
      </div>
      <div id="login-footer">
        <button id="login-prev" disabled>◀ Précédent</button>
        <button id="login-skip">Passer</button>
        <button id="login-done" class="primary">✅ Connecté — Suivant ▶</button>
      </div>
    </div>
  </div>

  <!-- Report Modal -->
  <div id="report-modal">
    <div id="report-content">
      <div id="report-header">
        <h2>📋 Rapport IA</h2>
        <button id="report-close-modal">✕</button>
      </div>
      <div id="report-body">Collecte...</div>
      <div id="report-footer">
        <button class="secondary" id="report-export-md">📄 Export .md</button>
        <button class="secondary" id="report-refresh">⟳</button>
        <button id="report-close-btn">Fermer</button>
      </div>
    </div>
  </div>

  <script src="windowManager.js"></script>
  <script src="layoutModel.js"></script>
  <script src="resizeController.js"></script>
  <script src="persistenceManager.js"></script>
  <script src="presetLayouts.js"></script>
  <script src="sidebar.js"></script>
  <script src="bookmarks.js"></script>
  <script src="promptDispatcher.js"></script>
  <script src="reportManager.js"></script>
  <script src="changelog.js"></script>
  <script src="loginAssistant.js"></script>
  <script src="app.js"></script>
</body>
</html>
