<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamAI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- SIDEBAR -->
    <aside id="sidebar">
      <div id="logo">🧠 TeamAI</div>
      <div id="stats"></div>
      <div id="window-list"></div>

      <div id="zoom-controls">
        <button id="zoom-out">−</button>
        <span id="zoom-level">100%</span>
        <button id="zoom-in">+</button>
        <button id="zoom-reset">⊙</button>
      </div>

      <div class="section-title">PROVIDERS</div>
      <div id="providers-list"></div>

      <div id="sidebar-bottom">
        <button id="btn-report" class="action-btn">📋 Rapport complet</button>
        <button id="btn-new-tab" class="action-btn primary">Nouvel Onglet IA +</button>
        <div id="version-badge" title="Voir les commits">v0.0.0</div>
      </div>
    </aside>

    <!-- MAIN -->
    <div id="main">
      <!-- Prompt bar TOP -->
      <div id="prompt-bar">
        <input type="text" id="prompt-input" placeholder="Pose ta question à TOUTES les IA (Enter = GO)" autofocus>
        <button id="go-btn">C'est un ordre, GO !</button>
      </div>

      <!-- Viewport scrollable with webviews -->
      <div id="viewport">
        <div id="grid-container"></div>
      </div>
    </div>
  </div>

  <!-- Report modal -->
  <div id="report-modal">
    <div id="report-content">
      <div id="report-header">
        <h2>📋 Rapport IA — Synthèse</h2>
        <button id="report-close-modal">✕</button>
      </div>
      <div id="report-body">Collecte en cours...</div>
      <div id="report-footer">
        <button class="secondary" id="report-export-md">📄 Export .md</button>
        <button class="secondary" id="report-refresh">⟳ Actualiser</button>
        <button id="report-close-btn">Fermer</button>
      </div>
    </div>
  </div>

  <script src="windowManager.js"></script>
  <script src="sidebar.js"></script>
  <script src="promptDispatcher.js"></script>
  <script src="reportManager.js"></script>
  <script src="app.js"></script>
</body>
</html>
